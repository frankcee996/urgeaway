name: UrgeAway
options:
  bundleIdPrefix: com.example.urgeaway
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  FirebaseiOS:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0

targets:
  UrgeAway:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UrgeAway
        excludes:
          - "**/*.md"
    resources:
      - path: UrgeAway/Resources/Assets.xcassets
    info:
      path: UrgeAway/Resources/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.urgeaway
        INFOPLIST_FILE: UrgeAway/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: FirebaseiOS
        product: FirebaseAuth
      - package: FirebaseiOS
        product: FirebaseCore
    postCompileScripts: []

  UrgeAwayTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UrgeAwayTests
    dependencies:
      - target: UrgeAway
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.urgeaway.tests

schemes:
  UrgeAway:
    build:
      targets:
        UrgeAway: all
        UrgeAwayTests: [test]
    test:
      targets:
        - UrgeAwayTests
    run:
      config: Debug
